<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Levéltári Raktárkataszter</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Dexie.js és Chart.js beágyazása (akár lokális fájlból is, ha nincs net) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="lib/dexie.min.js"></script>
    <script src="lib/chart.min.js"></script>
  </head>
  <body>
    <div id="takaras" class="display_none"></div>
    
    <div id="data_highlight" class="display_none text-center opacity_0 rounded-5"></div>

    <div class="container-fluid">
      <div class="row">
        <div class="col">
              <div class="container">
                <div class="row">
                  <div class="col">
                    <div class="card bg-dark text-white mt-4 mb-4 p-3 shadow-sm border-0" id="wholeRunningmeters">
                      <div class="card-body p-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <h5 class="mb-1 fw-bold text-warning">
                          <i class="bi bi-pie-chart-fill me-2"></i>Összesített Raktári Kapacitás
                        </h5>
                        <span class="small text-light-50" id="global-stats-subtitle">Adatok betöltése...</span>
                        <br>
                        <div class="d-flex align-items-center gap-3" style="min-width: 250px;">
                          <div class="progress flex-grow-1" style="height: 20px;">
                            <div id="global-progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                          </div>
                          <span id="global-percent-badge" class="badge bg-success fs-6">0%</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col">
                    <div class="card shadow-sm border-0 mb-4 m-auto">
                      <div class="card-body">
                        <canvas id="fondDobozChart" style="min-height: 300px;"></canvas>
                      </div>
                    </div>
                    <div class="card shadow-sm border-0 mb-4 m-auto">
                      <div class="card-body">
                        <canvas id="fondMeterChart" style="min-height: 300px;"></canvas>
                      </div>
                    </div>
                  </div>
                </div>
    
    
              </div>
          </div>
        </div>
      </div>
      <div class="container-fluid">
      <div class="row mb-4">
        <!-- 1. FEJLÉC: Globális Kereső -->
        <header class="main-header">
          <div class="logo">ArchivKataszter v1.0</div>
          <div class="search-box">
            <input
              type="text"
              id="global-search"
              placeholder="Gyorskeresés (Fond, állag, doboz...)"
            />
            <button id="search-btn">Keresés</button>
          </div>
        </header>
      </div>
      <div class="row">
        <div class="col-2 border-end">
                     
              <nav class="nav-menu">
                <button class="nav-link active" id="btn-dashboard">
                  Vezérlőpult (Dashboard)
                </button>
                <hr />
                <h3>Raktárak</h3>
                <ul id="storage-tree">
                
                </ul>
              </nav>
            
          
        </div>
          
        <div class="col-10">
              <div class="row">
        
        <div class="col-md-3 border-end">
            <h5 class="mb-3 text-secondary"><i class="bi bi-diagram-3-fill me-2"></i>Raktár hierarchia</h5>
            <div class="warehouse-tree-container bg-light p-3 rounded" style="min-height: 500px; max-height: 700px; overflow-y: auto;">
                
                <ul class="list-unstyled warehouse-tree">
                    
                </ul>

            </div>
        </div>

        <div class="col-md-9 px-4">

<div class="card bg-light mb-4 shadow-sm">
    
</div>

<div id="warehouse-occupancy-card" class="card bg-light mb-4 shadow-sm border-0">
    
  </div>

 
  <div class="card bg-light mb-4 shadow-sm border-0">
    <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-3">
      
      
      <div>
        <h4 class="mb-1 fw-bold text-primary" id="shelf-title">
          <i class="bi bi-grid-3x3-gap-fill me-2"></i>Kiválasztott Állvány
        </h4>
        <span class="text-muted small" id="shelf-subtitle">
          Válassz ki egy állványt a bal oldali fában!
        </span>
      </div>

      
      <div class="btn-group shadow-sm" role="group" aria-label="Nézetváltó">
        <button type="button" class="btn btn-outline-primary active" id="btn-view-visual">
          <i class="bi bi-grid-fill me-1"></i> 🧊 Vizuális polc
        </button>
        <button type="button" class="btn btn-outline-primary" id="btn-view-table">
          <i class="bi bi-table me-1"></i> 📋 Táblázat
        </button>
      </div>

    </div>

</div>
  
            
        </div>
        

    </div>
    
</div>
<div class="shelf-content">

  </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
